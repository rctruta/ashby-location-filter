<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Job Board Location & Department Filter</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header class="top">
    <div class="top-bar">
      <div>
        <h1>Job board location & department filter</h1>
        <p class="subtitle">An interactive browser tool that normalizes locations by address country, filters across functional departments, and aggregates multiple Ashby boards into one unified search.</p>
      </div>
    </div>
    <p class="source-meta" id="source-slot"></p>
  </header>

  <!-- Modern Top Filter Bar -->
  <div class="filter-bar" id="filter-bar-slot"></div>

  <!-- Active Filter Tag Pills -->
  <div class="active-pills-bar" id="active-pills-slot"></div>

  <!-- Main Content Container (Full Width) -->
  <div class="content-container">
    <main id="results-slot"></main>
  </div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
