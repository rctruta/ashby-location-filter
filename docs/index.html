<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ashby Multi-Board Job Filter</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header class="top">
    <div class="top-bar">
      <div>
        <h1>Ashby Multi-Board Job Filter</h1>
        <p class="subtitle">One search bar for public Ashby-hosted job boards — normalized by country and city, with add/remove support for any company using Ashby's Posting API.</p>
      </div>
    </div>
    <p class="source-meta" id="source-slot"></p>
  </header>

  <!-- Modern Top Filter Bar -->
  <div class="filter-bar" id="filter-bar-slot"></div>

  <!-- Active Filter Tag Pills -->
  <div class="active-pills-bar" id="active-pills-slot"></div>

  <!-- Main Content Container (Full Width) -->
  <div class="content-container">
    <main id="results-slot"></main>
  </div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
