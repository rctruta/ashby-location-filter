# What the published snapshot contains.
# A posting field that is not listed under posting_fields is held back.

companies:
  - id: cohere
    name: Cohere
    provider: Ashby
    feed_url: https://api.ashbyhq.com/posting-api/job-board/cohere
    output: docs/data/cohere.json
  - id: ramp
    name: Ramp
    provider: Ashby
    feed_url: https://api.ashbyhq.com/posting-api/job-board/ramp
    output: docs/data/ramp.json
  - id: linear
    name: Linear
    provider: Ashby
    feed_url: https://api.ashbyhq.com/posting-api/job-board/linear
    output: docs/data/linear.json

manifest_output: docs/data/manifest.json

posting_fields:
