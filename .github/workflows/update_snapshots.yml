name: update-snapshots
on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:
    inputs:
      company:
        description: 'Company ID to update (leave blank for all)'
        required: false
        default: ''

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Install dependencies
        run: |
          uv sync
      - name: Fetch and diff snapshots
        run: |
          if [ -n "${{ inputs.company }}" ]; then
            .venv/bin/python -m tools.publish_snapshot --company "${{ inputs.company }}"
          else
            .venv/bin/python -m tools.publish_snapshot --all
          fi
      - name: Open or update snapshot PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [ -n "$(git status --porcelain docs/data/)" ]; then
            BRANCH="chore/update-snapshots"
            git checkout -B "$BRANCH"
            git add docs/data/
            git commit -m "chore(data): update job snapshots and diffs"
            git push --force -u origin "$BRANCH"
            if ! gh pr view "$BRANCH" --json url >/dev/null 2>&1; then
              gh pr create \
                --base main \
                --head "$BRANCH" \
                --title "chore(data): update job snapshots and diffs" \
                --body "Automated daily Ashby job board snapshot refresh."
            fi
          else
            echo "No changes in snapshots."
          fi
